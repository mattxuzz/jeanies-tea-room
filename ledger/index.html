<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F3A6C4">
<title>家庭小账本</title>
<style>
:root{
  --bg:#FFF9F6; --card:#FFFFFF; --ink:#4A3B36; --ink2:#8B7B74; --ink3:#B5A8A2; --line:#F2E9E4;
  --pink:#F286A4; --pink-d:#D9537E; --pink-l:#FDEBF0;
  --mint:#6FC7A8; --mint-l:#E4F5EF;
  --yellow:#F0BB5C; --yellow-l:#FEF3DC;
  --purple:#A394DA; --purple-l:#EFEBFA;
  --blue:#84BEE4; --blue-l:#E8F3FB;
  --in:#2FA47E; --out:#EE6B82;
  --shadow:0 4px 16px rgba(120,90,80,.06),0 1px 3px rgba(120,90,80,.04);
  --shadow-lg:0 10px 28px rgba(226,131,158,.20);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.sm{width:14px;height:14px}.ic.lg{width:24px;height:24px}.ic.xl{width:32px;height:32px}.ic.xxl{width:40px;height:40px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px}

/* header */
.hd{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#FFD0DD 0%,#F6B0C8 50%,#D6BEEC 100%);
  padding:20px 20px 16px;border-radius:0 0 26px 26px;color:#fff;box-shadow:0 6px 20px rgba(190,150,180,.20);overflow:hidden}
.hd-bg{position:absolute;top:56px;right:40px;width:58px;height:58px;opacity:.35;pointer-events:none}
.hd-bg .moon{width:52px;height:52px;stroke:#fff;stroke-width:1.4;fill:none;opacity:.9}
.hd-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.75}
.hd-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.hd-title{font-size:21px;font-weight:800;letter-spacing:2px;display:flex;align-items:center;gap:9px}
.hd-title .cat-paw{width:24px;height:24px;flex:none;color:#fff;fill:currentColor;stroke:none}
.hd-sub{font-size:11px;opacity:.92;margin-top:5px;font-weight:500;letter-spacing:0;min-height:16px;transition:opacity .5s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px}
.hd-season{position:absolute;top:60px;right:104px;width:26px;height:26px;opacity:.7;pointer-events:none;color:#fff}
.hd-season .ic{width:26px;height:26px;stroke:#fff;stroke-width:1.5}
@media(max-width:340px){.hd-sub{max-width:200px;font-size:10.5px}}
.hd-tools{display:flex;gap:8px}
.ic-btn{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:#fff}
.mo{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;position:relative;z-index:1}
.mo button{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center}
.mo .mo-label{font-size:16px;font-weight:700;min-width:112px;text-align:center;letter-spacing:1px}

/* page */
.page{display:none;padding:18px 16px 0;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:13px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--ink)}
.card-t .ic{color:var(--pink)}
.link{font-size:12px;color:var(--pink-d);font-weight:600;display:inline-flex;align-items:center;gap:3px}

/* seg */
.seg{display:flex;background:#F7EEEA;border-radius:13px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s}
.seg button.on{background:#fff;color:var(--pink-d);box-shadow:0 2px 8px rgba(120,90,80,.10)}

/* stat trio */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.stat{border-radius:16px;padding:13px 5px;text-align:center}
.stat .l{font-size:11px;font-weight:600;opacity:.9;display:flex;align-items:center;justify-content:center;gap:4px}
.stat .l .ic{width:13px;height:13px}
.stat .v{font-size:17px;font-weight:800;margin-top:6px;letter-spacing:-.3px}
.stat.out{background:var(--pink-l);color:var(--pink-d)}
.stat.in{background:var(--mint-l);color:var(--in)}
.stat.bal{background:var(--yellow-l);color:#B07E1C}
.stat.avail{background:var(--purple-l);color:#6E5CB0}

/* buttons */
.add-big{width:100%;border-radius:16px;padding:14px;background:linear-gradient(135deg,#F79CB6,#EE7C9E);color:#fff;
  font-size:16px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:13px;transition:transform .15s,box-shadow .15s}
.add-big:active{transform:scale(.98);box-shadow:0 4px 12px rgba(226,131,158,.18)}
.sbtn{padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.sbtn.dep{background:var(--mint);color:#fff}.sbtn.done{background:var(--yellow);color:#fff}
.sbtn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}

/* list */
.rec{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.rec-main{flex:1;min-width:0}
.rec-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-s{font-size:11px;color:var(--ink2);margin-top:3px}
.rec-amt{font-size:15px;font-weight:800;white-space:nowrap}
.rec-amt.in{color:var(--in)}.rec-amt.out{color:var(--ink)}
.rec-amt.saving{color:#6E5CB0}
.tag-sav{font-size:10px;font-weight:700;color:#6E5CB0;background:var(--purple-l);padding:2px 6px;border-radius:7px;margin-right:5px;vertical-align:1px}
.empty{text-align:center;color:var(--ink2);font-size:13px;padding:24px 10px;line-height:1.8}
.empty .ec{color:var(--pink);opacity:.5;margin-bottom:8px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wk{text-align:center;font-size:11px;color:var(--ink2);font-weight:600;padding:4px 0}
.cal .day{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);font-size:13px;position:relative;border:1.5px solid transparent}
.cal .day.mute{opacity:.3}
.cal .day.sel{background:var(--pink-l);border-color:var(--pink);color:var(--pink-d);font-weight:800}
.cal .day .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%}
.cal .day .dot.in{background:var(--in)}.cal .day .dot.out{background:var(--out)}

/* 按月宫格（仿日历） */
.years{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.years button{width:32px;height:32px;border-radius:11px;background:var(--pink-l);color:var(--pink-d);display:flex;align-items:center;justify-content:center}
.years button:disabled{opacity:.35;cursor:default}
.years .yl{font-size:16px;font-weight:800;letter-spacing:1px;min-width:92px;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcell{min-height:82px;border-radius:14px;background:var(--bg);padding:10px 3px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;border:1.5px solid transparent}
.mcell.cur{background:var(--pink-l);border-color:var(--pink)}
.mcell .mn{font-size:15px;font-weight:800;line-height:1.1}
.mcell .mb{font-size:10px;margin-top:6px;line-height:1.6;font-weight:600}
.mcell .mb .up{color:var(--in)}.mcell .mb .dn{color:var(--out)}
.mcell .mc{font-size:10px;color:var(--ink2);margin-top:5px;font-weight:700}

/* report */
.big-num{text-align:center;padding:8px 0 4px}
.big-num .l{font-size:12px;color:var(--ink2)}
.big-num .v{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:4px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.mini{border-radius:14px;padding:12px;text-align:center}
.mini .l{font-size:11px;opacity:.9;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.mini .l .ic{width:13px;height:13px}
.mini .v{font-size:16px;font-weight:800;margin-top:5px}
.mini.in{background:var(--mint-l);color:var(--in)}
.mini.out{background:var(--pink-l);color:var(--pink-d)}
.mini.save{background:var(--yellow-l);color:#B07E1C}
.mini.saving{background:var(--purple-l);color:#6E5CB0}
.mini.avail{background:var(--purple-l);color:#6E5CB0}
.total-head{position:relative}
.total-head .big-num{padding-bottom:0}
.edit-total{position:absolute;right:0;top:6px;width:30px;height:30px;border-radius:10px;background:var(--bg);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.avail-bar{border-radius:14px;background:var(--purple-l);color:#6E5CB0;padding:12px 14px;margin-top:12px;display:flex;align-items:center;justify-content:space-between}
.avail-bar .al{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.avail-bar .av{font-size:19px;font-weight:800}
.sav-line{display:flex;align-items:center;justify-content:space-between;background:var(--purple-l);color:#6E5CB0;border-radius:12px;padding:10px 13px;margin-top:12px;font-size:12px;font-weight:600}
.sav-line span{display:flex;align-items:center;gap:6px}.sav-line .ic{width:14px;height:14px}.sav-line b{font-size:15px}
.bar-row{margin-bottom:11px}
.bar-lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.bar-lab .nm{font-weight:600;display:inline-flex;align-items:center;gap:5px}.bar-lab .nm .ic{width:14px;height:14px;color:var(--pink)}
.bar-lab .vl{color:var(--ink2)}
.bar-lab .vl b{color:var(--ink);font-weight:800}
.bar-track{height:9px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .4s ease}
/* 支出构成：饼图 + 小类列表 */
.pie-wrap{display:flex;align-items:center;gap:18px;padding:4px 0 6px}
.pie-chart{width:132px;height:132px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.pie-hole{width:76px;height:76px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line)}
.pie-hole .pt{font-size:10px;color:var(--ink2)}
.pie-hole .pv{font-size:14px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.pie-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.pie-leg-row{display:flex;align-items:center;gap:7px;font-size:12px}
.pie-dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.pie-leg-name{flex:1;min-width:0;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie-leg-val{font-size:11px;color:var(--ink2);white-space:nowrap}
.pie-leg-val b{color:var(--ink);font-weight:800}
.sub-list{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.sub-list-head{font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:10px}
.sub-group{margin-bottom:12px}.sub-group:last-child{margin-bottom:0}
.sub-group-t{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px}
.sg-amt{margin-left:auto;font-size:11px;color:var(--ink2);font-weight:600}
.sub-list-row{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);padding:5px 0 5px 15px;border-bottom:1px dashed var(--line)}
.sub-list-row:last-child{border-bottom:none}
.sub-list-row span:first-child{color:var(--ink)}
.sub-list-row b{color:var(--ink);font-weight:800}
.bgtag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:6px}
.bgtag.ok{background:var(--mint-l);color:var(--in)}.bgtag.warn{background:var(--yellow-l);color:#B07E1C}.bgtag.over{background:var(--pink-l);color:var(--pink-d)}
.budget-group{margin-bottom:14px}.budget-group:last-child{margin-bottom:0}
.budget-group-t{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line)}

/* savings */
.save-item{border-radius:15px;padding:13px;margin-bottom:10px;background:var(--bg)}
.save-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.save-em{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff}
.save-em .ic{width:21px;height:21px}
.save-nm{font-size:14px;font-weight:700;flex:1}
.save-pct{font-size:13px;font-weight:800;color:var(--pink-d)}
.save-track{height:10px;border-radius:6px;background:#F0E6E1;overflow:hidden;margin-bottom:9px}
.save-fill{height:100%;border-radius:6px;transition:width .5s ease}
.save-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink2)}
.save-btns{display:flex;gap:7px}
.badge-done{display:inline-block;background:var(--mint-l);color:var(--in);font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;height:66px;background:#fff;
  border-top:1px solid #F5EFEC;display:flex;z-index:25;padding-top:4px;padding-bottom:8px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#BFB7B2}
.tab .ti{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.tab .ti .ic{width:24px;height:24px;stroke-width:1.7}
.tab .tl{font-size:11px;font-weight:600;letter-spacing:1px}
.tab.on{color:var(--pink)}
.tab.on .ti .ic{stroke-width:1.9}
.tab .ti .paw-ic{width:23px;height:23px;fill:currentColor;stroke:none}
.home-ind{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);width:134px;height:4px;border-radius:3px;background:#E7E1DE;z-index:26}

/* 二级页面通用头 */
.sub-hd{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.sub-back{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sub-back .ic{width:18px;height:18px}
.sub-title{font-size:17px;font-weight:800;flex:1}
.sub-add{display:flex;align-items:center;gap:4px;border:none;border-radius:12px;padding:8px 12px;background:var(--pink);color:#fff;font-size:12px;font-weight:700}
.sub-add .ic{width:14px;height:14px}
.sub-cats{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:11px;padding:7px 9px;background:var(--card);color:var(--ink2);font-size:11px;font-weight:700}
.sub-cats .ic{width:13px;height:13px}
.sub-tea{display:flex;align-items:center;gap:3px;border:1px solid #EBD9C4;border-radius:11px;padding:7px 9px;background:#FFF7EC;color:#B8873F;font-size:11px;font-weight:700}
.sub-tea .ic{width:13px;height:13px}
.chip-p.add{border-style:dashed;color:var(--pink);background:transparent}
.backup-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.backup-btns .sbtn{justify-content:center;width:100%;min-height:38px;padding:8px 4px;white-space:nowrap}
/* 报表明细 */
.clickable{cursor:pointer;transition:background .15s}
.clickable:hover{background:var(--bg)}
.dt-sum{font-size:13px;color:var(--ink2);margin-bottom:12px;padding:10px 12px;background:var(--bg);border-radius:10px}
.dt-sum b{color:var(--pink-d)}
.dt-list{max-height:56vh;overflow:auto}
.dt-row{padding:11px 2px;border-bottom:1px solid var(--line)}
.dt-row:last-child{border-bottom:none}
.dt-r1{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.dt-r1 b{color:var(--pink-d)}
.dt-r2{font-size:11px;color:var(--ink2);margin-top:5px}
.cloud-box{border:1.5px solid #E7E0EC;border-radius:14px;padding:12px;margin:14px 0;background:#F9F6FD}
.cloud-t{font-size:12px;font-weight:800;color:#6E5CB0;margin-bottom:6px}
.cloud-s{font-size:11px;color:#8B7B74}
.cat-manage-row{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:12px;background:var(--bg);margin-bottom:8px;font-size:13px;font-weight:600}
.cat-manage-row .ic{width:15px;height:15px;vertical-align:-3px;margin-right:5px}
.cat-manage-row small{color:var(--ink2);font-weight:500;font-size:11px;margin-left:5px}
.mini-del{border:none;background:var(--pink-l);color:var(--pink-d);border-radius:9px;padding:5px 11px;font-size:11px;font-weight:700}
.stock-filter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.stock-filter .chip-p{font-size:11px;padding:6px 12px}
.stock-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ss-cell{background:var(--card);border-radius:14px;padding:9px 6px;text-align:center;box-shadow:0 2px 10px rgba(120,90,80,.05)}
.ss-cell .v{font-size:19px;font-weight:800;color:var(--pink)}
.ss-cell .l{font-size:10px;color:var(--ink2);margin-top:2px}

/* 临期提醒 + 分类分组 */
.expiry-alert{border-radius:16px;background:linear-gradient(135deg,#FFF8E8,#FEF6E6);border:1px solid #F5E3BC;padding:13px 14px;margin-bottom:15px}
.expiry-alert.over{background:linear-gradient(135deg,#FFEBEF,#FFE1E6);border-color:#F5C4CE}
.expiry-alert.over .ea-t{color:var(--pink-d)}
.expiry-alert.over .ea-row{border-bottom-color:#F3D2D9}
.ea-t{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--pink-d);margin-bottom:9px}
.ea-t .ic{width:15px;height:15px}
.ea-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:6px 2px;border-bottom:1px dashed #F3DDE0;cursor:pointer}
.ea-row:last-child{border-bottom:none}
.stock-group{margin-bottom:16px}
.stock-group-t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:9px;color:var(--ink)}
.stock-group-t .ic{width:16px;height:16px}
.stock-group-t span{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg);padding:2px 7px;border-radius:8px}

/* 消耗品库存 */
.stock-sum{font-size:11px;color:var(--ink2);font-weight:600;margin-bottom:10px}
.stock-item{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line)}
.stock-item:last-child{border-bottom:none}
.stock-item.used{opacity:.5}
.stock-main{flex:1;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.stock-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--pink);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.stock-check.on{background:var(--pink)}
.stock-check .ic{width:13px;height:13px}
.stock-info{min-width:0;flex:1}
.stock-nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-item.used .stock-nm{text-decoration:line-through}
.stock-s{font-size:10.5px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-tag{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:7px;margin-left:6px;vertical-align:1px}
.exp-tag.ok{background:var(--mint-l);color:var(--in)}
.exp-tag.soon{background:var(--yellow-l);color:#B07E1C}
.exp-tag.over{background:var(--pink-l);color:var(--pink-d)}
.stock-btns{display:flex;gap:5px}

/* 记账附加区（入库 / 茶叶同步） */
.extra-box{border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:14px;background:var(--bg)}
.extra-box.tea{border-color:#E2D9F2;background:#F7F4FC}
.ck{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.ck input{width:17px;height:17px;accent-color:var(--pink);margin:0}
.extra-box.tea .ck{color:#6E5CB0}
.extra-box .fld{margin-bottom:11px}.extra-box .fld:last-of-type{margin-bottom:0}
.extra-box .fld label{font-size:11px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(91,75,69,.42);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px 28px;max-height:88vh;overflow-y:auto;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sh-t{font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px}
.sh-t .ic{color:var(--pink)}
.x{width:30px;height:30px;border-radius:10px;background:var(--bg);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.type-seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px}
.type-seg button{flex:1;padding:10px;border-radius:11px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.type-seg button.on[data-t=expense]{background:var(--pink);color:#fff}
.type-seg button.on[data-t=income]{background:var(--mint);color:#fff}
.type-seg button.on[data-t=saving]{background:var(--purple);color:#fff}
.amt-wrap{text-align:center;padding:6px 0 14px}
.amt-wrap .cur{font-size:24px;font-weight:700;color:var(--ink2)}
.amt-wrap input{width:70%;border:none;background:none;text-align:center;font-size:42px;font-weight:800;color:var(--ink);outline:none;letter-spacing:-1px}
.amt-wrap input::placeholder{color:#DCCFCA}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--bg);outline:none;transition:border-color .2s,background .2s}
.input:focus{border-color:var(--pink);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-p{padding:8px 14px;border-radius:12px;background:var(--bg);font-size:13px;font-weight:600;border:1.5px solid transparent;display:inline-flex;align-items:center;gap:6px}
.chip-p .ic{width:16px;height:16px}
.chip-p.on{background:var(--pink-l);border-color:var(--pink);color:var(--pink-d)}
.chip-p.sub.on{background:var(--mint-l);border-color:var(--mint);color:var(--in)}
.icon-pick{display:flex;flex-wrap:wrap;gap:7px}
.icon-pick button{width:40px;height:40px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink2);border:1.5px solid transparent}
.icon-pick button.on{background:var(--pink-l);border-color:var(--pink);color:var(--pink-d)}
.icon-pick button .ic{width:20px;height:20px}
.save-btn{width:100%;padding:14px;border-radius:15px;background:var(--pink);color:#fff;font-size:16px;font-weight:800;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.del-btn{width:100%;padding:12px;border-radius:13px;color:var(--pink-d);font-size:13px;font-weight:700;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.hint{font-size:11px;color:var(--ink2);line-height:1.7;margin-top:8px}

/* cat manager */
.cat-group{margin-bottom:16px}
.cat-group-h{margin-bottom:8px}
.cat-group-n{font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.cat-group-n .ic{width:16px;height:16px;color:var(--pink)}
.tag-row{display:flex;flex-wrap:wrap;gap:7px}
.tag{padding:7px 10px;border-radius:10px;background:var(--pink-l);color:#B23A57;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.tag .ic{width:13px;height:13px}
.tag.sub{background:var(--mint-l);color:var(--in)}
.tag .bd{font-size:10px;opacity:.75}
.add-inline{display:flex;gap:7px;margin-top:9px}
.add-inline input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--bg);outline:none;font-size:13px}
.add-inline button{padding:8px 13px;border-radius:10px;background:var(--pink);color:#fff;font-size:12px;font-weight:700}
.big-block{margin-bottom:13px;padding:11px;border-radius:13px;background:var(--bg)}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(91,75,69,.92);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.row{display:flex;gap:9px}.row>*{flex:1}
</style>

  </div>

<script>
/* ============ 图标助手 ============ */
function ic(n,c=''){return `<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;}
const PICK_ICONS=['home','gift','basket','drop','bus','bag','star','heart','plane','laptop','car','book-2','coins','receipt','tag','target','moon','cat-head','paw','sparkle','wallet','out'];

/* ============ 数据层（向后兼容）============ */
const KEY='family_finance_v1';
function defaultData(){
  return {
    openingBalance:0,
    incomeCats:['工资','奖金','理财','红包','其他'],
    expenseCats:{
      '家庭支出':['买菜做饭','水电物业','房租房贷','交通出行','日用杂货','茶叶','其他'],
      '给家人':['给爸妈','给孩子','给伴侣','其他'],
      '其他':['其他']
    },
    savingCats:{
      '长期储蓄':['定期存款','基金定投','黄金','其他'],
      '其他':['其他']
    },
    catIcons:{}, budgets:{},
    stockCats:['零食','日用品','护肤品','茶叶','其他'],
    records:[], savings:[], stock:[], settings:{lastExport:null}
  };
}
function load(){
  try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s),base=defaultData();
    const m=Object.assign(base,d);
    if(!m.catIcons||typeof m.catIcons!=='object')m.catIcons={};
    if(!m.savingCats||typeof m.savingCats!=='object'||!Object.keys(m.savingCats).length)m.savingCats=defaultData().savingCats;
    if(!m.budgets||typeof m.budgets!=='object')m.budgets={};
    if(!Array.isArray(m.stock))m.stock=[];
    if(!Array.isArray(m.stockCats)||!m.stockCats.length)m.stockCats=['零食','日用品','护肤品','茶叶','其他'];
    // 预算结构迁移：旧的数字 → {amount, period:'month'}
    for(const k in m.budgets){if(typeof m.budgets[k]==='number')m.budgets[k]={amount:m.budgets[k],period:'month'};
      else if(!m.budgets[k]||typeof m.budgets[k]!=='object')delete m.budgets[k];}
    return m;
  }}catch(e){}
  return defaultData();
}
/* ============ Supabase 云同步（与茶室共用项目/账号）============ */
const _SUPA = window.supabase.createClient(
  'https://wrcxyprfgsowvmxomrju.supabase.co',
  'sb_publishable_KO-nXbLuNiphNyU5pvm4aw_quJkMdNN'
);
let DATA=load();
let _cloudUser=null, _syncTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch(e){toast('保存失败，存储空间可能已满');}
  clearTimeout(_syncTimer);_syncTimer=setTimeout(_syncCloud,600);}
async function _syncCloud(){
  if(!_cloudUser)return false;
  try{
    const teas=(()=>{try{return JSON.parse(localStorage.getItem('tea_teas_v3')||'[]');}catch(e){return [];}})();
    const {error}=await _SUPA.from('store').upsert([
      {user_id:_cloudUser.id,key:'finance',value:DATA},
      {user_id:_cloudUser.id,key:'teas',value:teas}
    ],{onConflict:'user_id,key'});
    if(error){console.warn('云同步失败',error);toast('云同步失败：'+(error.message||'未知错误'));return false;}
    _markCloudSync();
    return true;
  }catch(e){console.warn('云同步异常',e);toast('云同步异常，请检查网络');return false;}
}
function _markCloudSync(){
  try{localStorage.setItem('finance_last_sync',new Date().toISOString());}catch(e){}
  const el=document.getElementById('cloudStatus');
  if(el)el.textContent='已同步 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
/* 强制把当前 localStorage 数据推到云端（覆盖云端 finance/teas） */
async function forceUpload(){
  if(!_cloudUser){toast('请先登录');return;}
  const local=load();
  if(!confirm('把当前设备的数据上传到云端，覆盖云端记录？建议先确认云端没有更新的数据。'))return;
  DATA=local;saveLocalOnly();
  const ok=await _syncCloud();
  toast(ok?'本地数据已上传到云端':'上传失败，请重试');
  render();
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim(),pwd=document.getElementById('loginPwd').value;
  const err=document.getElementById('loginErr'),btn=event&&event.target;
  err.style.display='none';
  const {error}=await _SUPA.auth.signInWithPassword({email,password:pwd});
  if(error){err.textContent=error.message==='Invalid login credentials'?'邮箱或密码错误':error.message;err.style.display='block';return;}
  await afterLogin();
}
async function doSignup(){
  const email=document.getElementById('loginEmail').value.trim(),pwd=document.getElementById('loginPwd').value;
  const err=document.getElementById('loginErr');err.style.display='none';
  if(pwd.length<6){err.textContent='密码至少 6 位';err.style.display='block';return;}
  const {error}=await _SUPA.auth.signUp({email,password:pwd});
  if(error){err.textContent=error.message;err.style.display='block';return;}
  err.textContent='注册成功，请点登录';err.style.display='block';
}
async function afterLogin(){
  document.getElementById('loginOverlay').style.display='none';
  const cs=document.getElementById('cloudStatus');if(cs)cs.textContent='已登录 · 自动同步中';
  const {data:{session}}=await _SUPA.auth.getSession();
  if(!session)return;
  _cloudUser=session.user;
  const {data}=await _SUPA.from('store').select('key,value').eq('user_id',session.user.id);
  if(data&&data.length){
    const m=Object.fromEntries(data.map(r=>[r.key,r.value]));
    const localCnt=(DATA.records||[]).length, cloudCnt=m.finance?(m.finance.records||[]).length:0;
    if(m.finance && cloudCnt>=localCnt){
      DATA=Object.assign(defaultData(),m.finance);saveLocalOnly();
    }else if(localCnt>cloudCnt){
      /* 本地数据更多：保留本地并上传，避免被云端旧数据覆盖 */
      try{localStorage.setItem('finance_last_sync','pending');}catch(e){}
      await _syncCloud();
      toast('本地数据已上传到云端');
    }
    if(m.teas&&m.teas.length){try{localStorage.setItem('tea_teas_v3',JSON.stringify(m.teas));}catch(e){}}
  }else{await _syncCloud();}
  render();
}
function saveLocalOnly(){try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch(e){}}

/* ============ 茶室打通（同域名共享 localStorage）============ */
const TEA_STORE='tea_teas_v3';
function loadTeas(){try{const v=localStorage.getItem(TEA_STORE);return v?JSON.parse(v):[];}catch(e){return [];}}
/* 跳转珍珠的茶室：部署在同源仓库根路径（../ 从 /ledger/ 回到仓库根） */
const TEA_ROOM_URL='../';
function openTeaRoom(){
  let w=null;try{w=window.open(TEA_ROOM_URL,'_blank');}catch(e){}
  if(!w){window.prompt('浏览器拦截了弹窗。请复制下面地址到浏览器打开茶室：',new URL(TEA_ROOM_URL,location.href).href);}
}

/* 茶叶提交后：写标记 + 弹窗引导去茶室完善 */
const TEA_PENDING_KEY='tea_pending_complete';
function markTeaPending(name,grams){
  try{localStorage.setItem(TEA_PENDING_KEY,JSON.stringify({name:name,grams:grams,ts:Date.now()}));}catch(e){}
}
function askGoTeaRoom(name,grams){
  markTeaPending(name,grams);
  if(confirm('已提交成功！\n\n去茶室完善「'+name+'」的详细信息（年份/工艺/产区等）？')){
    openTeaRoom();
  }
}
/* 同步一笔茶叶到茶室：同名追加购买批次，无同名新建并标记待完善 */
function syncTeaPurchase(name,amount,grams,date,needComplete){
  if(!name)return {ok:false,msg:'没填茶名'};
  let teas=loadTeas();
  const ym=(date||dateNow()).slice(0,7);
  const buy={m:ym,price:+amount||0,mode:'direct',per:0,n:0,g:+grams||0};
  const hit=teas.find(t=>(t.name||'').trim()===name.trim());
  if(hit){
    if(!Array.isArray(hit.purchases))hit.purchases=[];
    hit.purchases.push(buy);
    hit.weight=(+hit.weight||0)+(+grams||0);
    hit.price=(+hit.price||0)+(+amount||0);
  }else{
    teas.push({id:Math.random().toString(36).slice(2,10),class:'青茶',sub:'',variety:'',name:name.trim(),
      brand:'',year:'',craft:'',weight:+grams||0,consumed0:0,price:+amount||0,buyDate:date||dateNow(),
      purchases:[buy],form:'散茶',note:'',noSpend:false,needComplete:needComplete!==false});
  }
  try{localStorage.setItem(TEA_STORE,JSON.stringify(teas));
    if(_cloudUser)_syncCloud();  // 云同步版：立即推到云端 teas，茶室下次打开即可看到
    return {ok:true,msg:hit?'已计入茶室这款茶':'茶室已新建，打开茶室可完善'};}
  catch(e){return {ok:false,msg:'茶室存储写入失败'};}
}
/* 库存「茶叶」分类的物品 → 同步到茶室（标记待完善） */
function syncStockTea(item){
  const grams=+(String(item.qty||'').replace(/[^0-9.]/g,''))||0;
  const amount=0;
  return syncTeaPurchase(item.name,amount,grams,item.added||dateNow(),true);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return String(n).padStart(2,'0');}
function ymNow(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function dateNow(){return ymNow()+'-'+pad(new Date().getDate());}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ymOf(r){return (r.date||'').slice(0,7);}
function sumMonth(ym){let inc=0,exp=0,sav=0;for(const r of DATA.records){if(ymOf(r)===ym){if(r.type==='income')inc+=+r.amount;else if(r.type==='saving')sav+=+r.amount;else exp+=+r.amount;}}return{inc,exp,sav,bal:inc-exp-sav};}
function sumYear(year){let inc=0,exp=0,sav=0;for(const r of DATA.records){if((r.date||'').slice(0,4)===String(year)){if(r.type==='income')inc+=+r.amount;else if(r.type==='saving')sav+=+r.amount;else exp+=+r.amount;}}return{inc,exp,sav,bal:inc-exp-sav};}
function sumAll(){let inc=0,exp=0,sav=0;for(const r of DATA.records){if(r.type==='income')inc+=+r.amount;else if(r.type==='saving')sav+=+r.amount;else exp+=+r.amount;}const net=inc-exp-sav;return{inc,exp,sav,net,total:(+DATA.openingBalance||0)+net};}
function recsOfMonth(ym){return DATA.records.filter(r=>ymOf(r)===ym).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.id>a.id?1:-1));}
function savedTotal(){return (DATA.savings||[]).reduce((s,p)=>s+(+p.saved||0),0);}

/* 分类图标/预算 的 key */
function catKey(type,name,big){
  const p=type==='income'?'inc':type==='saving'?'sav':'exp';
  return p+':'+(big?big+'/'+name:name);
}
function getIcon(type,name,big){
  const k=catKey(type,name,big);
  if(DATA.catIcons[k])return DATA.catIcons[k];
  if(type==='income')return 'coins';
  if(type==='saving')return 'target';
  const map={'家庭支出':'home','给家人':'gift','其他':'receipt','买菜':'basket','水电':'drop','房':'home','交通':'bus','出行':'bus','日用':'bag','购物':'bag','娱乐':'star','医疗':'heart','旅游':'plane','礼金':'gift'};
  for(const kk in map)if((name||'').indexOf(kk)>=0)return map[kk];
  return 'receipt';
}
function getBudget(type,name,big){const b=(DATA.budgets||{})[catKey(type,name,big)];return b?(typeof b==='number'?b:(+b.amount||0)):0;}
function getBudgetPeriod(type,name,big){const b=(DATA.budgets||{})[catKey(type,name,big)];return b&&typeof b==='object'?(b.period||'month'):'month';}
function spentOf(type,name,big,scope,period){
  return DATA.records.filter(r=>{
    if(r.type!=='expense')return false;
    if(scope){
      if(period==='year'){if((r.date||'').slice(0,4)!==String(scope))return false;}
      else if(ymOf(r)!==scope)return false;
    }
    return big?(r.big===big&&r.sub===name):(r.big===name);
  }).reduce((s,r)=>s+ +r.amount,0);
}
function migrateKey(map,oldK,newK){if(oldK===newK)return;if(map[oldK]!==undefined){map[newK]=map[oldK];delete map[oldK];}}

function stockCats(){return DATA.stockCats||['零食','日用品','护肤品','茶叶','其他'];}
function guessStockCat(big,sub,name){
  const s=(big||'')+(sub||'')+(name||'');
  if(/零食|坚果|饼|糖|巧克|薯片|饮料|牛奶|酸奶|水果/.test(s))return '零食';
  if(/护肤|面膜|精华|乳液|面霜|洗面奶|口红|防晒|化妆|香水|眼霜|爽肤水/.test(s))return '护肤品';
  if(/日用|纸|洗|清洁|洗衣|牙膏|纸巾|收纳/.test(s))return '日用品';
  return '其他';
}
function daysLeft(exp){
  if(!exp)return null;
  const diff=Math.ceil((new Date(exp+'T23:59:59')-new Date())/86400000);
  return diff;
}
function expTag(exp){
  const d=daysLeft(exp);if(d===null)return '';
  if(d<0)return `<span class="exp-tag over">已过期${-d}天</span>`;
  if(d<=7)return `<span class="exp-tag soon">剩${d}天</span>`;
  return `<span class="exp-tag ok">${exp.slice(5)}到期</span>`;
}
function stockItemHtml(p){
  return `<div class="stock-item ${p.used?'used':''}">
    <div class="stock-main" onclick="toggleStockUsed('${p.id}')">
      <div class="stock-check ${p.used?'on':''}">${p.used?ic('pencil','sm'):''}</div>
      <div class="stock-info"><div class="stock-nm">${esc(p.name)}${expTag(p.expire)}</div>
        <div class="stock-s">${esc(p.qty||'1')} 件 · ${p.added||''} 入库${p.usedAt?' · '+p.usedAt+' 用完':''}${p.feeling?' · '+esc(p.feeling):''}</div></div>
    </div>
    <div class="stock-btns"><button class="sbtn ghost" onclick="editStock('${p.id}')">编辑</button></div>
  </div>`;
}
function pickStockFilter(c){ui.stockFilter=c;renderStock();}
function renderStock(){
  const all=DATA.stock||[],ym=ymNow();
  const inMonth=all.filter(x=>ymOf({date:x.added})===ym).length;
  const usedMonth=all.filter(x=>x.used&&(x.usedAt||'').slice(0,7)===ym).length;
  const current=all.filter(x=>!x.used).length;
  let h=`<div class="sub-hd">
    <button class="sub-back" onclick="go('home')">${ic('left')}</button>
    <div class="sub-title">仓库</div>
    <button class="sub-tea" onclick="openTeaRoom()">${ic('drop','sm')}茶室</button>
    <button class="sub-cats" onclick="openStockCats()">${ic('tag','sm')}分类</button>
    <button class="sub-add" onclick="editStock()">${ic('plus','sm')}添加</button>
  </div>
  <div class="stock-stats">
    <div class="ss-cell"><div class="v">${inMonth}</div><div class="l">本月入库</div></div>
    <div class="ss-cell"><div class="v">${usedMonth}</div><div class="l">本月用完</div></div>
    <div class="ss-cell"><div class="v">${current}</div><div class="l">当前库存</div></div>
  </div>
  <div class="stock-filter">${['全部'].concat(stockCats()).map(c=>
    `<div class="chip-p ${ui.stockFilter===c?'on':''}" onclick="pickStockFilter('${esc(c)}')">${esc(c)}</div>`).join('')}</div>`;
  // 按筛选过滤
  const shown=(ui.stockFilter&&ui.stockFilter!=='全部')?all.filter(x=>(x.cat||'其他')===ui.stockFilter):all;
  // 已过期 / 临期 分开两个框（均未用完、有有效期）
  const expired=shown.filter(x=>!x.used&&x.expire&&daysLeft(x.expire)<0)
    .sort((a,b)=>(a.expire||'').localeCompare(b.expire||''));
  const soon=shown.filter(x=>!x.used&&x.expire&&daysLeft(x.expire)>=0&&daysLeft(x.expire)<=7)
    .sort((a,b)=>(a.expire||'').localeCompare(b.expire||''));
  if(expired.length)h+=`<div class="expiry-alert over"><div class="ea-t">${ic('sparkle')} 已过期 · ${expired.length} 件</div>
    ${expired.map(p=>`<div class="ea-row" onclick="editStock('${p.id}')"><span>${esc(p.name)}</span>${expTag(p.expire)}</div>`).join('')}</div>`;
  if(soon.length)h+=`<div class="expiry-alert"><div class="ea-t">${ic('sparkle')} 即将过期 · ${soon.length} 件</div>
    ${soon.map(p=>`<div class="ea-row" onclick="editStock('${p.id}')"><span>${esc(p.name)}</span>${expTag(p.expire)}</div>`).join('')}</div>`;
  if(!shown.length)h+=emptyBox('库存空空的','记账时勾选「同时入库」\n或点右上角「添加」手动录入');
  else{
    // 在用按分类分组；用完的单独归入「历史」
    const groups={};
    shown.filter(x=>!x.used).forEach(p=>{const c=p.cat||'其他';(groups[c]=groups[c]||[]).push(p);});
    stockCats().concat(Object.keys(groups).filter(c=>stockCats().indexOf(c)<0)).forEach(c=>{
      if(!groups[c]||!groups[c].length)return;
      h+=`<div class="stock-group"><div class="stock-group-t">${ic(c==='护肤品'?'heart':c==='零食'?'basket':'tag','sm')}${c} <span>${groups[c].length}</span></div>
        <div class="card">${groups[c].map(stockItemHtml).join('')}</div></div>`;
    });
    const history=shown.filter(x=>x.used);
    if(history.length){
      history.sort((a,b)=>(b.usedAt||'').localeCompare(a.usedAt||''));
      h+=`<div class="stock-group"><div class="stock-group-t">${ic('book-2','sm')}历史 <span>${history.length}</span></div>
        <div class="card">${history.map(stockItemHtml).join('')}</div></div>`;
    }
    h+=`<div class="hint" style="text-align:center">点物品即可划掉/恢复用完状态</div>`;
  }
  document.getElementById('page-stock').innerHTML=h;
}

function saveStock(){
  const nm=document.getElementById('st-name').value.trim();if(!nm){toast('填个名字吧');return;}
  const obj={name:nm,cat:ui.ceCat||'其他',qty:document.getElementById('st-qty').value||'1',
    expire:document.getElementById('st-exp').value||'',
    feeling:document.getElementById('st-feeling').value.trim(),added:dateNow()};
  DATA.stock=DATA.stock||[];
  let saved;
  if(ui.stockEdit){const i=DATA.stock.findIndex(x=>x.id===ui.stockEdit);
    DATA.stock[i]=Object.assign({},DATA.stock[i],obj);saved=DATA.stock[i];}
  else{saved=Object.assign({id:uid(),used:false,recId:''},obj);DATA.stock.push(saved);}
  save();
  closeM('m-stock');render();
  if(saved.cat==='茶叶'){syncStockTea(saved);toast('存好啦');askGoTeaRoom(saved.name,saved.qty);}

function composeCard(type,scope,label){
  const recs=DATA.records.filter(r=>{
    if(r.type!==type)return false;
    if(scope===null)return true;
    if(scope.startsWith('year:'))return (r.date||'').slice(0,4)===scope.slice(5);
    return ymOf(r)===scope;
  });
  const map={},subMap={};
  recs.forEach(r=>{const k=r.big||'其他';map[k]=(map[k]||0)+ +r.amount;
    if(r.sub){const sk=k+'/'+r.sub;subMap[sk]=(subMap[sk]||0)+ +r.amount;}});
  const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const isExp=type==='expense';
  const title=type==='saving'?'储蓄构成':isExp?'支出构成':'收入构成';
  const emptyMsg=type==='saving'?'还没有储蓄数据':isExp?'还没有支出数据':'还没有收入数据';
  if(!arr.length)return `<div class="card"><div class="card-h"><div class="card-t">${ic('pie')}${title}</div><span class="link" style="color:var(--ink2)">${label}</span></div>${emptyBox(emptyMsg,'记几笔就能看到分布啦')}</div>`;
  const total=arr.reduce((s,a)=>s+a[1],0),max=arr[0][1];
  const colors=type==='saving'?['#A394DA','#8FC4E8','#6FC7A8','#F0BB5C']:
    isExp?['#F286A4','#F0BB5C','#6FC7A8','#A394DA','#84BEE4','#F0A07A']:['#6FC7A8','#84BEE4','#A394DA','#F0BB5C','#F286A4','#F0A07A'];

  // 支出：大类饼图（conic-gradient）+ 小类分组列表，均显示金额与百分比
  if(isExp){
    let acc=0;
    const stops=arr.map((a,i)=>{const start=acc;acc+=a[1]/total*100;return `${colors[i%colors.length]} ${start}% ${acc}%`;}).join(',');
    const legend=arr.map((a,i)=>{
      const pct=total?Math.round(a[1]/total*100):0;
      return `<div class="pie-leg-row clickable" onclick="openDetail('${scope||''}','expense','${esc(a[0])}')"><span class="pie-dot" style="background:${colors[i%colors.length]}"></span><span class="pie-leg-name">${esc(a[0])}</span><span class="pie-leg-val">¥${fmt(a[1])} · <b>${pct}%</b></span></div>`;
    }).join('');
    let groups='';
    arr.forEach((a,i)=>{
      const subs=Object.entries(subMap).filter(([sk])=>sk.startsWith(a[0]+'/'))
        .map(([sk,v])=>[sk.slice(a[0].length+1),v]).sort((x,y)=>y[1]-x[1]);
      if(!subs.length)return;
      groups+=`<div class="sub-group"><div class="sub-group-t"><span class="pie-dot" style="background:${colors[i%colors.length]}"></span>${esc(a[0])} <span class="sg-amt">¥${fmt(a[1])} · ${total?Math.round(a[1]/total*100):0}%</span></div>
        ${subs.map(([sn,sv])=>`<div class="sub-list-row clickable" onclick="openDetail('${scope||''}','expense','${esc(a[0])}','${esc(sn)}')"><span>${esc(sn)}</span><span>¥${fmt(sv)} · <b>${total?Math.round(sv/total*100):0}%</b></span></div>`).join('')}</div>`;
    });
    const subSection=groups?`<div class="sub-list"><div class="sub-list-head">小类明细</div>${groups}</div>`:'';
    return `<div class="card"><div class="card-h"><div class="card-t">${ic('pie')}${title}</div><span class="link" style="color:var(--ink2)">${label}</span></div>
      <div class="pie-wrap"><div class="pie-chart" style="background:conic-gradient(${stops})"><div class="pie-hole"><div class="pt">合计</div><div class="pv">¥${fmt(total)}</div></div></div><div class="pie-legend">${legend}</div></div>${subSection}</div>`;
  }
  // 收入 / 储蓄：只分大类，条形图
  const bars=arr.map((a,i)=>{const pct=total?Math.round(a[1]/total*100):0;
    return `<div class="bar-row clickable" onclick="openDetail('${scope||''}','${type}','${esc(a[0])}')"><div class="bar-lab"><span class="nm">${ic(getIcon(type,a[0]))}${esc(a[0])}</span><span class="vl">¥${fmt(a[1])} · <b>${pct}%</b></span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${a[1]/max*100}%;background:${colors[i%colors.length]}"></div></div></div>`;}).join('');
  return `<div class="card"><div class="card-h"><div class="card-t">${ic('pie')}${title}</div><span class="link" style="color:var(--ink2)">${label}</span></div>${bars}</div>`;
}

function budgetCard(ym){
  const b=DATA.budgets||{},targetYM=ym||ui.homeYM,year=targetYM.slice(0,4);

  if(!allKeys.length)return `<div class="card"><div class="card-h"><div class="card-t">${ic('target')}预算执行</div><span class="link" onclick="openCats()">去设置 ${ic('right','sm')}</span></div>${emptyBox('还没有设预算','点分类图标给支出分类定月/年预算')}</div>`;
  const groupRows=(period)=>{
    const keys=allKeys.filter(k=>{const v=b[k],p=(v&&typeof v==='object')?(v.period||'month'):'month';return p===period&&(typeof v==='number'?v:(+v.amount||0))>0;});
    if(!keys.length)return '';
    const scope=period==='year'?year:targetYM;
    const title=period==='year'?year+' 年度预算':targetYM.slice(5)+' 月预算';

      const parts=k.slice(4).split('/'),big=parts[0],sub=parts[1]||'';

      const v=b[k],bud=typeof v==='number'?v:(+v.amount||0);

      const tag=pct>100?'<span class="bgtag over">超支</span>':pct>=80?'<span class="bgtag warn">接近</span>':'<span class="bgtag ok">正常</span>';
      return `<div class="bar-row"><div class="bar-lab"><span class="nm">${ic(icon)}${esc(name)}${tag}</span><span class="vl">¥${fmt(spent)} / <b>¥${fmt(bud)}</b> · ${pct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,pct)}%;background:${pct>100?'var(--out)':pct>=80?'var(--yellow)':'var(--mint)'}"></div></div></div>`;
    }).join('');
    return `<div class="budget-group"><div class="budget-group-t">${title}</div>${rows}</div>`;

  document.getElementById('ce-icons').innerHTML=PICK_ICONS.map(n=>`<button class="${ui.ce.icon===n?'on':''}" onclick="ui.ce.icon='${n}';renderCeIcons()">${ic(n)}</button>`).join('');
  openM('m-catEdit');
}
function renderCeIcons(){
  document.getElementById('ce-icons').innerHTML=PICK_ICONS.map(n=>`<button class="${ui.ce.icon===n?'on':''}" onclick="ui.ce.icon='${n}';renderCeIcons()">${ic(n)}</button>`).join('');
}
function saveCatEdit(){
  const name=document.getElementById('ce-name').value.trim();
  if(!name){toast('填个名字吧');return;}
  const {scope,parent,oldName,icon,period}=ui.ce,info=catScopeInfo(scope,parent),type=info.type;
  const bud=Math.max(0,parseFloat(document.getElementById('ce-budget').value)||0);
  const exists=scope==='income'?DATA.incomeCats.includes(name)
    :scope==='big'?DATA.expenseCats[name]!==undefined:scope==='sub'?(DATA.expenseCats[parent]||[]).includes(name)
    :scope==='sbig'?DATA.savingCats[name]!==undefined:(DATA.savingCats[parent]||[]).includes(name);
  if(exists&&name!==oldName){toast('已经有同名分类了');return;}
  const oldKey=oldName?catKey(type,oldName,parent||null):'',newKey=catKey(type,name,parent||null);
  const migrate=(map)=>{if(oldKey!==newKey&&map[oldKey]!==undefined){map[newKey]=map[oldKey];delete map[oldKey];}};

  if(scope==='income'){
    if(oldName&&name!==oldName){DATA.incomeCats[DATA.incomeCats.indexOf(oldName)]=name;
      DATA.records.forEach(r=>{if(r.type==='income'&&r.big===oldName)r.big=name;});
      migrate(DATA.catIcons);migrate(DATA.budgets);
    }else if(!oldName)DATA.incomeCats.push(name);
  }else if(scope==='big'||scope==='sbig'){
    const group=info.group,prefix=type==='saving'?'sav:':'exp:';
    if(oldName&&name!==oldName){
      const rebuilt={};Object.keys(group).forEach(k=>{rebuilt[k===oldName?name:k]=group[k];});
      if(type==='saving')DATA.savingCats=rebuilt;else DATA.expenseCats=rebuilt;
      DATA.records.forEach(r=>{if(r.type===type&&r.big===oldName)r.big=name;});
      [DATA.catIcons,DATA.budgets].forEach(map=>{
        Object.keys(map).filter(k=>k===prefix+oldName||k.startsWith(prefix+oldName+'/')).forEach(k=>migrate(map,k,k.replace(prefix+oldName,prefix+name)));
      });
    }else if(!oldName)group[name]=['其他'];
  }else{
    const group=info.group,arr=group[parent]||(group[parent]=[]);
    if(oldName&&name!==oldName){arr[arr.indexOf(oldName)]=name;
      DATA.records.forEach(r=>{if(r.type===type&&r.big===parent&&r.sub===oldName)r.sub=name;});
      migrate(DATA.catIcons);migrate(DATA.budgets);
    }else if(!oldName)arr.push(name);
  }
  DATA.catIcons[newKey]=icon;
  if(type==='expense'&&bud>0)DATA.budgets[newKey]={amount:bud,period:period};else delete DATA.budgets[newKey];
  save();closeM('m-catEdit');renderCats();render();toast('分类保存好啦');
}
function delCatEdit(){
  const {scope,parent,oldName}=ui.ce;if(!oldName)return;
  if(!confirm('删除「'+oldName+'」？用过的历史账单会保留，但会显示为未分类。'))return;
  const info=catScopeInfo(scope,parent),type=info.type,key=catKey(type,oldName,parent||null),prefix=type==='saving'?'sav:':'exp:';
  if(scope==='income')DATA.incomeCats=DATA.incomeCats.filter(x=>x!==oldName);
  else if(scope==='big'||scope==='sbig'){
    const group=info.group;delete group[oldName];
    [DATA.catIcons,DATA.budgets].forEach(map=>Object.keys(map).filter(k=>k===prefix+oldName||k.startsWith(prefix+oldName+'/')).forEach(k=>delete map[k]));
  }else{
    info.group[parent]=(info.group[parent]||[]).filter(x=>x!==oldName);
    delete DATA.catIcons[key];delete DATA.budgets[key];
  }
  if(scope!=='big'&&scope!=='sbig'){delete DATA.catIcons[key];delete DATA.budgets[key];}
  save();closeM('m-catEdit');renderCats();render();toast('已删除');
}

/* ============ 攒钱项目 ============ */
const COLORS=['#F286A4','#F0BB5C','#6FC7A8','#A394DA','#84BEE4','#F0A07A'];
function openSaving(id){
  ui.saveEdit=id||null;const p=id?DATA.savings.find(x=>x.id===id):null;

function saveProject(){
  const name=document.getElementById('s-name').value.trim(),target=parseFloat(document.getElementById('s-target').value),saved=parseFloat(document.getElementById('s-saved').value)||0;
  if(!name){toast('给项目起个名字吧');return;}
  if(!target||target<=0){toast('填一下目标金额');return;}
  const p={id:ui.saveEdit||uid(),name,target,saved,icon:ui.sIcon,color:ui.sColor};
  if(ui.saveEdit){const i=DATA.savings.findIndex(x=>x.id===ui.saveEdit);DATA.savings[i]=p;}else DATA.savings.push(p);
  save();closeM('m-save');render();toast('目标定好啦');
}
function delProject(){if(!ui.saveEdit)return;DATA.savings=DATA.savings.filter(x=>x.id!==ui.saveEdit);save();closeM('m-save');render();toast('已删除');}
function deposit(id){
  const p=DATA.savings.find(x=>x.id===id);
  const v=prompt('这次往「'+p.name+'」存多少？','');
  if(v===null)return;const n=parseFloat(v);if(!n||n<=0){toast('金额不对哦');return;}
  p.saved=(+p.saved||0)+n;save();render();toast('存进去啦');
}
function execProject(id){
  const p=DATA.savings.find(x=>x.id===id);
  if(!confirm('确定「'+p.name+'」已经攒够并执行了吗？执行后会从列表移除。'))return;
  DATA.savings=DATA.savings.filter(x=>x.id!==id);save();render();toast('达成目标，恭喜');
}

/* 粘贴文本导入（小程序 → 云端） */
function importPasted(){
  const txt=(document.getElementById('pasteImport')||{}).value||'';
  if(!txt.trim()){toast('先粘贴备份内容');return;}
  let d;
  try{d=JSON.parse(txt.trim());}catch(e){toast('备份文本格式不对');return;}
  if(!d.records&&!d.savings&&!d.stock){toast('这不是账本备份');return;}
  if(!confirm('导入会覆盖当前账本数据，并同步到云端。确定继续吗？'))return;
  DATA=Object.assign(defaultData(),d);
  if(!Array.isArray(DATA.stock))DATA.stock=[];
  if(!Array.isArray(DATA.stockCats)||!DATA.stockCats.length)DATA.stockCats=['零食','日用品','护肤品','茶叶','其他'];
  if(!DATA.catIcons||typeof DATA.catIcons!=='object')DATA.catIcons={};
  if(!DATA.budgets||typeof DATA.budgets!=='object')DATA.budgets={};
  save();  // save() 会触发 _syncCloud() 上云
  closeM('m-set');ui.homeYM=ymNow();ui.billYM=ymNow();render();
  toast('导入成功'+( _cloudUser?'，正在同步到云端':'（登录后才会同步到云端）'));
}
/* 复制备份到剪贴板（微信内可用） */
function logoutCloud(){
  if(!confirm('退出后数据仍保留在本机，确定吗？'))return;
  try{localStorage.removeItem('su_access_token');}catch(e){}
  _SUPA.auth.signOut&&_SUPA.auth.signOut();
  _cloudUser=null;
  document.getElementById('cloudStatus').textContent='未登录';
  toast('已退出');
}
function copyBackup(){
  const txt=JSON.stringify(DATA);
  DATA.settings=DATA.settings||{};DATA.settings.lastExport=dateNow();saveLocalOnly();
  document.getElementById('lastExport').textContent='上次备份：'+dateNow();
  const done=()=>toast('备份已复制，可粘贴到备忘录/微信收藏保存');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  }else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea');ta.value=txt;
  ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');done();}catch(e){window.prompt('请手动复制下面备份内容：',txt);}
  document.body.removeChild(ta);
}
function exportData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='家庭小账本备份_'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href);
  DATA.settings=DATA.settings||{};DATA.settings.lastExport=dateNow();save();
  document.getElementById('lastExport').textContent='上次备份：'+dateNow();toast('备份已下载');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.records&&!d.savings)throw 0;
    if(!confirm('导入会覆盖当前所有数据，确定继续吗？'))return;
    DATA=Object.assign(defaultData(),d);
    if(!DATA.catIcons||typeof DATA.catIcons!=='object')DATA.catIcons={};
    if(!DATA.budgets||typeof DATA.budgets!=='object')DATA.budgets={};
    save();closeM('m-set');ui.homeYM=ymNow();ui.billYM=ymNow();render();toast('导入成功');
  }catch(err){toast('文件格式不对哦');}};
  rd.readAsText(f);e.target.value='';
}

const WHISPERS=[
  '原来幸福不贵，只是琐碎',
  '记录每一笔，是把日子过成自己喜欢的样子',
  '认真生活的人，连柴米油盐都闪着光',
  '省下的不是钱，是对未来的底气',
  '小小的账本，装着大大的日子',
  '今天也要好好记账，好好吃饭呀',
  '每一分攒下的，都是未来的自由',
  '慢慢来，日子会越过越有滋味'
];
const SEASONS={spring:'spring',summer:'summer',autumn:'autumn',winter:'winter'};
function seasonNow(){
  const m=new Date().getMonth()+1;
  return m>=3&&m<=5?SEASONS.spring:m>=6&&m<=8?SEASONS.summer:m>=9&&m<=11?SEASONS.autumn:SEASONS.winter;
}
function initWhisper(){
  const sub=document.getElementById('hdSub'),seasonEl=document.getElementById('hdSeason');
  if(seasonEl)seasonEl.innerHTML=ic(seasonNow());
  let i=Math.floor(Math.random()*WHISPERS.length);
  if(sub)sub.textContent=WHISPERS[i];
  setInterval(()=>{
    if(!sub)return;
    sub.style.opacity='0';
    setTimeout(()=>{i=(i+1)%WHISPERS.length;sub.textContent=WHISPERS[i];sub.style.opacity='1';},500);
  },6000);
}
